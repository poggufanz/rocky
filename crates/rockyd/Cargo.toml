[package]
name = "rockyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
notify = "8"
interprocess = "=2.4.7"
rocky-facts = { path = "../rocky-facts" }
rocky-proto = { path = "../rocky-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# libc: flock and umask for the daemon lock and the socket bind.
libc = "0.2"

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
interprocess = "=2.4.7"
serde_json = "1"
tempfile = "3"
