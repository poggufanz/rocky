[package]
name = "rockyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
notify = "8"
interprocess = "=2.4.7"
rocky-proto = { path = "../rocky-proto" }
serde_json = "1"
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
interprocess = "=2.4.7"
serde_json = "1"
tempfile = "3"
