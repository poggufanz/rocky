[package]
name = "rocky-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# regex-lite: the hook compiles these patterns once per event process, and the
# full engine's compile cost dominated per-event latency.
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# libc: peer credentials (SO_PEERCRED) and the effective uid for the desk
# socket. Locked at 0.2.189; newer releases break the Linux build.
libc = "0.2"
