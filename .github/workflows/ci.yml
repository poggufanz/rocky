name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: node
          - os: macos-latest
            node: node
          - os: windows-latest
            node: node
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.os != 'windows-latest'
        env:
          ROCKY_RUN_HOOK_SMOKE: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 'node' && '1' || '0' }}
        run: npm test
      - if: matrix.os == 'windows-latest'
        run: npm test
      - if: matrix.os == 'windows-latest'
        run: npm test -- check-command check-diff check-pre-push guard-rules cli-process exec run-process watch-command terminal-sanitize-process package-smoke-platform build-pipeline
      - run: npm pack --dry-run
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 'node'
        run: npm run package:smoke
      - if: matrix.os == 'windows-latest'
        run: npm run package:smoke
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 'node'
        run: npm run release:check -- --truth-only --report "${{ runner.temp }}/rocky-release-check.md"
